name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # picomatch GHSA-fc5q-39xc-vjpf has no patched release yet (see docs/SECURITY.md). Fail only on critical.
      - run: npm audit --omit=dev --audit-level=critical
